<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Ídolo - Acceso Premium</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor-login">
        <div class="logo-idolo">El Ídolo</div>
        <div id="subtitulo-estado" class="subtitulo">CLUB EXCLUSIVO</div>

        <!-- Alertas de estado -->
        <div id="alertas" class="mensaje"></div>

        <!-- LOGIN -->
        <form id="form-login" class="formulario activo">
            <div class="grupo-campo">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="grupo-campo">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn-dorado">Ingresar</button>
            <div class="cambio-pantalla">¿No tienes cuenta? <a id="ir-a-registro">Registrate aquí</a></div>
        </form>

        <!-- REGISTRO -->
        <form id="form-register" class="formulario">
            <div class="grupo-campo">
                <label for="reg-nombre">Nombre Completo</label>
                <input type="text" id="reg-nombre" required>
            </div>
            <div class="grupo-campo">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="grupo-campo">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required>
            </div>
            <button type="submit" class="btn-dorado">Crear Cuenta</button>
            <div class="cambio-pantalla">¿Ya eres miembro? <a id="ir-a-login">Inicia sesión</a></div>
        </form>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        const formLogin = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');
        const subtitulo = document.getElementById('subtitulo-estado');
        const alertas = document.getElementById('alertas');

        const mostrarAlerta = (txt, tipo) => {
            alertas.textContent = txt;
            alertas.className = `mensaje ${tipo}`;
        };

        document.getElementById('ir-a-registro').addEventListener('click', () => {
            formLogin.classList.remove('activo');
            formRegister.classList.add('activo');
            subtitulo.textContent = 'REGISTRO DE MIEMBROS';
            alertas.className = 'mensaje';
        });

        document.getElementById('ir-a-login').addEventListener('click', () => {
            formRegister.classList.remove('activo');
            formLogin.classList.add('activo');
            subtitulo.textContent = 'CLUB EXCLUSIVO';
            alertas.className = 'mensaje';
        });

        // Petición de Login a MongoDB
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (!res.ok) return mostrarAlerta(data.error, 'error');
                
                mostrarAlerta('¡Acceso concedido al Club!', 'exito');
                // Aquí guardas el token si usas JWT: localStorage.setItem('token', data.token);
            } catch (err) {
                mostrarAlerta('Error de conexión con el servidor', 'error');
            }
        });

        // Petición de Registro a MongoDB
        formRegister.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('reg-nombre').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });
                const data = await res.json();

                if (!res.ok) return mostrarAlerta(data.error, 'error');

                mostrarAlerta('Cuenta creada correctamente. ¡Ya puedes iniciar sesión!', 'exito');
                formRegister.reset();
            } catch (err) {
                mostrarAlerta('Error al intentar registrar el usuario', 'error');
            }
        });
    </script>
</body>
</html>
